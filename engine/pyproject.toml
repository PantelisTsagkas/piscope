[project]
name = "piscope-engine"
version = "0.1.0"
description = "Storage, search and statistical analysis of the decimal digits of pi"
readme = "README.md"
authors = [
    { name = "Pantelis Tsagkas", email = "102387490+PantelisTsagkas@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
generate = [
    "gmpy2>=2.3.2",
]

[project.scripts]
piscope-digits = "piscope_engine.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
