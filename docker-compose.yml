# PiScope: API on http://localhost:8000, interface on http://localhost:3000.
#   docker compose up --build
# The first start generates and verifies the digits into the piscope-data volume.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PISCOPE_DIGITS: ${PISCOPE_DIGITS:-1000000}
      PISCOPE_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}", "http://127.0.0.1:${WEB_PORT:-3000}"]'
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - piscope-data:/data
    restart: unless-stopped

  web:
    build:
      context: frontend
      args:
        # The browser calls the API directly, so this is the host address, not "api".
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  piscope-data:
