[tool.uv.workspace]
members = ["engine", "backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The engine must stay framework-free; see docs/architecture.md.
"fastapi".msg = "Only piscope_api may import FastAPI."

[tool.ruff.lint.per-file-ignores]
"backend/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["piscope_engine", "piscope_api"]
known-local-folder = ["engine_support", "api_support"]

[tool.ty.environment]
extra-paths = ["engine/tests", "backend/tests"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "backend/tests"]
addopts = "--import-mode=importlib --strict-markers"
pythonpath = ["engine/tests", "backend/tests"]
markers = [
    "slow: generates or verifies large digit counts (deselect with -m 'not slow')",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
